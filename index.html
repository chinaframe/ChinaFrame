<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>China Frame</title>

<style>
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: #ffffff;
    color: #111;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header img {
    height: 1000px;
}

.nav {
    display: flex;
    gap: 25px;
    font-size: 14px;
}

/* MAIN */
.main {
    display: flex;
    gap: 30px;
    margin-top: 30px;
}

.left {
    flex: 2;
}

.right {
    flex: 1;
}

/* FEATURE */
.featured img {
    width: 100%;
    border-radius: 8px;
}

.featured h1 {
    font-size: 26px;
    margin-top: 15px;
}

/* SIGNAL BOX */
.signal-box {
    border: 1px solid #ddd;
    padding: 20px;
    border-radius: 10px;
}

.signal-box img {
    height: 1000px;
    margin-bottom: 10px;
}

.signal-item {
    margin-bottom: 15px;
    font-size: 20px;
}

.signal-item span {
    color: #C9A227;
    font-weight: bold;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 60px;
}

.footer img {
    height: 1000px;
}
</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <!-- 🔥 China Frame 로고 -->
        <img src="chinaframe.png">

        <div class="nav">
            <div>Home</div>
            <div>Archive</div>
            <div>About</div>
            <div>Topics</div>
        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- LEFT -->
        <div class="left">

            <div class="featured">
                <img src="https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b">
                <h1>중국 부동산은 살아나는가? — 그렇게 단순하지 않다</h1>
                <p>표면적 회복 이면에 구조적 문제가 여전히 존재한다.</p>
            </div>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="signal-box">

                <!-- 🔥 Beijing Signal 로고 -->
                <img src="beijingsignal.png">

                <div class="signal-item">
                    <span>금융</span><br>
                    지급준비율 인하 → 단기 유동성 확대
                </div>

                <div class="signal-item">
                    <span>부동산</span><br>
                    대출 규제 완화 → 단기 반등 가능
                </div>

                <div class="signal-item">
                    <span>산업</span><br>
                    전기차 정책 지속 → 경쟁력 강화
                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        <!-- 🔥 GIPI 로고 -->
        <img src="gipi.png">

    </div>

</div>

</body>
</html>
